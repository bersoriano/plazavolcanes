<!doctype html>
<html lang="es">
  <body>
    <h1>Confirma tu correo en Plaza Volcanes</h1>
    <p>Abre este enlace para confirmar tu correo y entrar a tu cuenta.</p>
    <!-- RedirectTo already includes /auth/confirm?type=signup and context. -->
    <p><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}">Confirmar mi correo</a></p>
    <p>Si el enlace expiró, pide otro desde la página de ingreso. Si ya confirmaste tu correo, ingresa con tu contraseña.</p>
    <p>Si no solicitaste esta cuenta, ignora este mensaje.</p>
  </body>
</html>
